name: Build AutoTotem

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: gradle/actions/setup-gradle@v4

  - name: Build mod
    run: gradle build

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: AutoTotem-JAR
      path: build/libs/*.jar
